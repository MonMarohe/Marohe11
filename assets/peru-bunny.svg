<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900" role="img" aria-labelledby="title desc">
  <title id="title">Welcome Chan Chan · Alpaca de Adobe Arcade</title>
  <desc id="desc">Una alpaca blanca de píxeles, de cuello corto y lana esponjosa, explora un patio inspirado en las ruinas de Chan Chan. Muros de adobe, relieves de peces, corazones rosados y fuego dorado enmarcan la aventura. Una llamita amiga con pañuelo turquesa la acompaña y una araña violeta vigila el camino.</desc>
