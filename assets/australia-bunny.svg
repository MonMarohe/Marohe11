<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900" role="img" aria-labelledby="title desc">
  <title id="title">Welcome Iquitos · Delfín rosado de Jungle Arcade</title>
  <desc id="desc">Un delfín rosado amazónico de píxeles, con hocico alargado y aletas, explora una selva luminosa. Un koala y un canguro lo acompañan; una serpiente vigila el camino. Corazones, destellos y una llama dorada marcan su aventura.</desc>
