<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900" role="img" aria-labelledby="title desc">
  <title id="title">Welcome Cusco · Alpaca de los Andes</title>
  <desc id="desc">Una alpaca blanca de píxeles, de cuello corto, lana esponjosa y mejillas rosadas, explora terrazas andinas inspiradas en Machu Picchu y caminos luminosos. Un oso amigo con pañuelo turquesa recupera su vida; las águilas vigilan desde el cielo. Corazones rosados, chispas y una llama dorada señalan el camino.</desc>
